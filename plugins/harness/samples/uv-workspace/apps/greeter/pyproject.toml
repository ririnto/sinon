[project]
name = "workspace-greeter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["workspace-greeting"]

[project.scripts]
greeter = "greeter:main"

[tool.uv.sources]
workspace-greeting = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "greeter"
