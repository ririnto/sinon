name: pnpm

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pnpm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - run: npm install --global "$(node --print 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
