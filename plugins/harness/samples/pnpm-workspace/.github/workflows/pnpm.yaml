name: pnpm

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pnpm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
