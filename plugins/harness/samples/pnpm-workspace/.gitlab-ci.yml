stages:
  - validate

pnpm:
  stage: validate
  image: node:26
  before_script:
    - >-
      if manager="$(node --print 'const value = require("./package.json").packageManager; if (typeof value !== "string" || !/^pnpm@\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(value)) { throw new Error("packageManager must be a version-only pnpm pin"); } value')"; then
        npm install --global "$manager";
      else
        exit 1;
      fi
  script:
    - pnpm install --frozen-lockfile
    - pnpm run check
