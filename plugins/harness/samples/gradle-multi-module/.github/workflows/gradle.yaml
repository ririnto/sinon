name: Gradle Java checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gradle-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          problem-matcher: true
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Run the target Gradle check
        run: ./gradlew :check :buildSrc:check
