name: Gradle Java checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gradle-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Run the target Gradle check
        run: ./gradlew check
