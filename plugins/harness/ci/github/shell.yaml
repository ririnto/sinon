name: shell

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: git ls-files -z -- '*.sh' | GOWORK=off xargs -0 -r go tool -modfile=go.mod mvdan.cc/sh/v3/cmd/shfmt -d --

permissions:
  contents: read
