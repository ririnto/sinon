name: golangci-lint

on:
  push:
  pull_request:

jobs:
  golangci-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Go tools
        run: |-
          install_dir="${RUNNER_TEMP}/go-bin"
          mkdir -p "${install_dir}"
          export GOBIN="${install_dir}"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260910170248-571480214735
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - run: |-
          golangci-lint run
          golangci-lint fmt --diff
      - run: nilaway -include-pkgs="$(go list -m)" ./...
      - run: go test -race -shuffle=on -count=1 ./...

permissions:
  contents: read
