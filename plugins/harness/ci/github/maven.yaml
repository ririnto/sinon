name: Maven Java checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maven-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run the target Maven verification
        run: ./mvnw verify
