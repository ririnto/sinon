golangci-lint:
  stage: validate
  image: golang:1.27
  before_script:
    - |-
      install_dir="${CI_PROJECT_DIR}/.bin"
      mkdir -p "${install_dir}"
      export GOBIN="${install_dir}"
      go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      GOTOOLCHAIN=auto go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260918162853-acb8859b9031
  script:
    - export PATH="${CI_PROJECT_DIR}/.bin:${PATH}"
    - golangci-lint run
    - golangci-lint fmt --diff
    - nilaway -include-pkgs="$(go list -m)" ./...
    - go test -race -shuffle=on -count=1 ./...
