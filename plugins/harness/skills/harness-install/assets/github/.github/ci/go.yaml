name: golangci-lint

on:
  - push
  - pull_request

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Install Go tools
        run: |-
          install_dir="${RUNNER_TEMP}/go-bin"
          mkdir -p "${install_dir}"
          export GOBIN="${install_dir}"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260721205819-4a0f7653488a
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - uses: arduino/setup-task@v2
        with:
          version: 3.52.0
      - run: task check
