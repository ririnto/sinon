name: shellcheck

on:
  - push
  - pull_request

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - run: git ls-files -z -- '*.sh' | xargs -0 -r shellcheck -S warning
      - run: git ls-files -z -- '*.sh' | xargs -0 -r shfmt -d
