minimum_pre_commit_version: "4.6.0"
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: uv run scripts/check.py
        language: system
        stages:
          - pre-commit
      - id: full-lint
        name: full-lint
        entry: uv run scripts/check.py
        language: system
        stages:
          - pre-push
