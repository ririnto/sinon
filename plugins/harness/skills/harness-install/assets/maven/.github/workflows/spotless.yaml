name: spotless

on:
  - push
  - pull_request

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |-
          root=$(pwd -P)
          files=$(git ls-files -- "*.java" | while IFS= read -r file; do
              case "$file" in
                  *,*) echo "error: Java path contains comma and cannot be represented in spotlessFiles: $file" >&2; exit 1 ;;
              esac
              printf '%s/%s\n' "$root" "$file" | sed 's/[][\\.^$*+?{}()|]/\\&/g; s/^/^/; s/$/$/'
          done | paste -sd, -)
          if [ -z "$files" ]; then
              ./mvnw validate
              echo "spotless: no tracked Java files to check"
          else
              ./mvnw validate -DspotlessFiles="$files"
          fi
