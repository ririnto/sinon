name: Feature request
description: Propose a new user-visible or system capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or system problem this feature solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature and its expected behavior.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Name what this issue must not include.
    validations:
      required: false
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Core user flow
        - Existing user flow
        - Internal system behavior
        - Documentation or operator workflow
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |-
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Name the exact test, command, or manual QA action.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Note compatibility, migration, security, or UX risks.
    validations:
      required: false
