name: Task
description: Track scoped maintenance, documentation, refactor, or follow-up work.
title: "chore: "
labels: ["task"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the work to perform.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Dependency maintenance
        - Configuration
        - CI or release
        - Testing
        - Refactor
        - Documentation
        - Technical debt
        - Security
        - Other
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the exact files, packages, or behaviors in scope.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      placeholder: |-
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation method
      description: Name the exact test, command, or manual QA action.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Note rollback, compatibility, or scheduling risks.
    validations:
      required: false
