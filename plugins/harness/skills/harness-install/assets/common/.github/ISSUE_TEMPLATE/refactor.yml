name: Refactor
description: Propose behavior-preserving internal code or architecture changes.
title: "refactor: "
labels: ["refactor"]
body:
  - type: textarea
    id: target
    attributes:
      label: Target
      description: Name the code, module, boundary, or architecture area.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain why the refactor is needed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the internal structure change.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Broad: multiple modules or layers
        - Medium: one module with several files
        - Narrow: one file or package
        - Local: implementation details only
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior preservation
      description: State how existing behavior will be proven unchanged.
      placeholder: |-
        - [ ] Existing tests pass
        - [ ] Public API behavior checked
        - [ ] Manual QA completed when user-visible
    validations:
      required: true
  - type: textarea
    id: interfaces
    attributes:
      label: Interfaces and handoffs
      description: Name public APIs, schemas, types, contracts, or docs that must remain aligned.
      placeholder: |-
        - Public API to preserve:
        - Internal types changed:
        - Compatibility to verify:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |-
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Name the exact test, command, comparison, or manual QA action.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Note regression, compatibility, migration, or rollout risks.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
      description: Describe how to return to the previous structure if needed.
    validations:
      required: false
