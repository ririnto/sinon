[versions]
kotlin = "2.4.21"
ktlint = "14.2.0"
ktlint-engine = "1.8.0"
slf4j = "2.0.20"
kotest = "6.2.5"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
ktlint-bom = { group = "com.pinterest.ktlint", name = "ktlint-bom", version.ref = "ktlint-engine" }
ktlint-cli-ruleset-core = { group = "com.pinterest.ktlint", name = "ktlint-cli-ruleset-core" }
ktlint-rule-engine = { group = "com.pinterest.ktlint", name = "ktlint-rule-engine" }
ktlint-rule-engine-core = { group = "com.pinterest.ktlint", name = "ktlint-rule-engine-core" }
kotest-bom = { group = "io.kotest", name = "kotest-bom", version.ref = "kotest" }
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5-jvm" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core-jvm" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
