version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@tsconfig/node-lts"
        update-types:
          - version-update:semver-major
    groups:
      bun-development-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: gradle
    directory: /plugins/harness/tooling/kotlin-ktlint
    schedule:
      interval: weekly
    groups:
      kotlin-ktlint-toolchain:
        patterns:
          - "org.jetbrains.kotlin.jvm"
          - "org.jlleitschuh.gradle.ktlint"
          - "com.pinterest.ktlint:ktlint-bom"
          - "com.pinterest.ktlint:ktlint-cli-ruleset-core"
          - "com.pinterest.ktlint:ktlint-rule-engine"
          - "com.pinterest.ktlint:ktlint-rule-engine-core"
          - "com.pinterest.ktlint:ktlint-test"
          - "org.slf4j:slf4j-simple"
          - "org.jetbrains.kotlin:kotlin-test-junit5"
        update-types:
          - minor
          - patch
